font_family      JetBrainsMono Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        13.0

# Parchment-and-ink theme, matching the supplied desktop reference.
background        #111827
foreground        #f7f0dc
cursor             #f7f0dc
cursor_text_color  #1f2937
selection_background #537278
selection_foreground #fff9e8

color0  #3f4b4d
color1  #9d4b3f
color2  #58725f
color3  #a27938
color4  #526b78
color5  #806072
color6  #537278
color7  #d7d0b9
color8  #697477
color9  #b45b4d
color10 #6f8c70
color11 #b58c44
color12 #67808a
color13 #9a7589
color14 #6e9291
color15 #fff9e8

background_opacity 0.94
window_padding_width 8
window_border_width 2px
active_border_color #f7f0dc
inactive_border_color #f7f0dc
hide_window_decorations yes

# Keep terminal rendering crisp while retaining the Nerd Font icon glyphs.
disable_ligatures never
